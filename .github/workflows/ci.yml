name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci menolak lock yang dibuat di Windows (paket optional @emnapi hilang)
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          INBOUND_SECRET: ci-secret
          CRON_SECRET: ci-secret
          IP_HASH_SALT: ci-salt
