name: self-heal

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the latest production deployment
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          data=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=1&target=production")
          state=$(printf '%s' "$data" | jq -r '.deployments[0].state // "UNKNOWN"')
          url=$(printf '%s' "$data" | jq -r '.deployments[0].url // ""')
          echo "latest deployment: $state ($url)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe production health
        id: health
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            "https://tmail.mzg.my.id/api/health" || echo 000)
          echo "health status: $code"
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Redeploy when the build failed or the app is down
        if: >
          steps.inspect.outputs.state == 'ERROR' ||
          steps.inspect.outputs.state == 'CANCELED' ||
          steps.health.outputs.status == '000' ||
          steps.health.outputs.status == '500'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not configured"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook responded $code"
          test "$code" -ge 200 -a "$code" -lt 300
